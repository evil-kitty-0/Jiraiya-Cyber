name: Cyber tests

on:
  push:
    branches: [main, cyber-foundation]
  pull_request:
    branches: [main]

jobs:
  cyber-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Cyber foundation tests
        run: python -m unittest discover -s cyber -p 'test_*.py' -v
